name: Build centralized Pterodactyl images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile.nodejs-tools
      - .github/workflows/build-nodejs-tools.yml
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            tag: '22'
          - target: installer
            tag: installer-22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.nodejs-tools
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/kavionn/pterodactyl-nodejs:${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
